name=ArdPortal
version=0.9.0
author=Radoslaw Kubera (rkubera on GitHub)
maintainer=Radoslaw Kubera
url=https://github.com/rkubera/ArdPortal
sentence=Modular ESP portal with MQTT, Home Assistant and native Zigbee and Matter integration.
paragraph=JSON-defined controls, WiFi/AP setup, MQTT with verified TLS and Home Assistant Discovery, optional native Zigbee End Device/Router on ESP32-C5/C6/H2, Zigbee2MQTT converter and ZHA quirk export, Matter over Wi-Fi/Thread on supported ESP32 targets, HTTP/Zigbee OTA and diagnostics. Includes ArdFS persistent storage and ArdJSON; networking modules can be excluded at compile time. Includes standalone ArdMQTT; optionally selects PubSubClient instead. Default backends use only the ESP Arduino core.
category=Communication
architectures=esp32,esp8266
includes=ArdPortal.h,ArdJSON.h,ArdFS.h
