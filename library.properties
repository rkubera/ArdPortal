url=https://github.com/rkubera/ArdPortal
sentence=Modular ESP portal with MQTT, Home Assistant and native Zigbee integration.
paragraph=JSON-defined controls, WiFi/AP setup, MQTT with verified TLS and Home Assistant Discovery, optional native Zigbee End Device/Router on ESP32-C5/C6/H2, Zigbee2MQTT converter and ZHA quirk export, HTTP/Zigbee OTA and diagnostics. Includes ArdFS persistent storage and ArdJSON; networking modules can be excluded at compile time. Uses the ESP Arduino core without external runtime libraries.
category=Communication
architectures=esp32,esp8266
